[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thicket-backend"
version = "0.1.0"
description = "Thicket: turn field recordings into transparent biodiversity evidence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pillow>=10.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# BirdNET inference. birdnetlib is used only as a pinned, pip-installable
# carrier for the BirdNET v2.4 TFLite weights (CC BY-NC-SA 4.0).
birdnet = ["ai-edge-litert>=1.2", "birdnetlib==0.18.1"]
ml = ["scikit-learn>=1.4", "pandas>=2.0", "pyyaml>=6.0", "requests>=2.31"]
# scikit-maad is used only by a cross-check test of the acoustic indices.
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "scikit-maad>=1.4"]

[project.scripts]
thicket-api = "thicket.main:run"

[tool.setuptools.packages.find]
include = ["thicket*"]

[tool.setuptools.package-data]
thicket = ["models/data/*.json", "models/data/*.npz", "models/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
  "birdnet: requires BirdNET weights (pip install -e .[birdnet])",
  "slow: slower integration tests",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
