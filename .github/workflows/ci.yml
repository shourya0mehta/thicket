name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install
        run: pip install -e "backend[birdnet,ml,dev]"
      - name: Lint
        run: ruff check backend ml
      - name: Schema is fresh
        run: python backend/scripts/export_schema.py --check
      - name: Backend tests
        working-directory: backend
        run: pytest -q --maxfail=5
      - name: ML pipeline tests
        run: pytest -q ml/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - id: check
        working-directory: .
        run: if [ -f frontend/package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.present == 'true'
        run: npm ci
      - if: steps.check.outputs.present == 'true'
        run: npm run lint
      - if: steps.check.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.check.outputs.present == 'true'
        run: npm run check:types-fresh
      - if: steps.check.outputs.present == 'true'
        run: npm test
      - if: steps.check.outputs.present == 'true'
        run: npm run build
