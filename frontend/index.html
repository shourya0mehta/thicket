<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Thicket turns field recordings into transparent biodiversity evidence: species detection events, metrics, timelines and exports."
    />
    <meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1714" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Thicket: Listen to Nature</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('thicket-theme');
        } catch (e) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Thicket needs JavaScript to analyze recordings.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
