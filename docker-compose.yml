# Local production-like run: docker compose up --build
# Then open http://localhost:8000 (frontend) or http://localhost:8000/api/docs.
services:
  thicket:
    build: .
    image: thicket:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      THICKET_DATA_DIR: /data
      # Production refuses to start without sign-in. For Google sign-in put
      # AUTH_MODE=google, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and SESSION_SECRET
      # in .env. This compose file publishes on localhost only by default, so a
      # private single-user laptop install may opt out explicitly instead.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      ALLOW_UNAUTHENTICATED: ${ALLOW_UNAUTHENTICATED:-true}
      # Same-origin by default (frontend served by the API). Add origins for a
      # separately hosted frontend, comma separated, no wildcards.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      RETAIN_AUDIO: ${RETAIN_AUDIO:-false}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes:
      - thicket-data:/data
    restart: unless-stopped
    mem_limit: 2g
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  thicket-data:
