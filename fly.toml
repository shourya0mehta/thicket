# Fly.io: fly launch --no-deploy --copy-config && fly volumes create thicket_data --size 5 && fly deploy
# One machine, 2 shared CPUs and 2 GB RAM (BirdNET needs ~1 GB with headroom).
app = "thicket"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  THICKET_DATA_DIR = "/data"
  ALLOWED_ORIGINS = "https://thicket.fly.dev"
  # Rate limits key on the client IP that Fly's edge writes (and overwrites) in
  # Fly-Client-IP. Never set FORWARDED_ALLOW_IPS="*": uvicorn would then take the
  # left end of X-Forwarded-For, which any client can set to bypass the limit.
  CLIENT_IP_HEADER = "Fly-Client-IP"
  WORKER_CONCURRENCY = "1"
  RETAIN_AUDIO = "false"
  RATE_LIMIT_PER_MINUTE = "30"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[[mounts]]
  source = "thicket_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
