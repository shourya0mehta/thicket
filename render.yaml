# Render Blueprint: https://render.com/docs/blueprint-spec
# One Docker web service with a persistent disk for the database and assets.
# The "standard" plan has 2 GB RAM, which BirdNET needs; keep one instance.
services:
  - type: web
    name: thicket
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    numInstances: 1
    autoDeploy: true
    disk:
      name: thicket-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: THICKET_DATA_DIR
        value: /data
      # Set to your public origin(s) if the frontend is hosted elsewhere.
      - key: ALLOWED_ORIGINS
        value: https://thicket.onrender.com
      # A public instance needs sign-in: production refuses to start without it.
      # The Google OAuth client needs the redirect URI
      # https://thicket.onrender.com/api/v1/auth/google/callback
      - key: AUTH_MODE
        value: google
      - key: PUBLIC_BASE_URL
        value: https://thicket.onrender.com
      - key: FRONTEND_URL
        value: https://thicket.onrender.com
      # Required secrets: Render asks for each value when the Blueprint is applied.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Rate limits key on the last X-Forwarded-For entry, the address Render's
      # proxy appended, which a client cannot choose. Never set
      # FORWARDED_ALLOW_IPS="*": uvicorn would then trust the left end, which any
      # client can set to bypass the limit.
      - key: CLIENT_IP_HEADER
        value: X-Forwarded-For
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: RETAIN_AUDIO
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: LOG_LEVEL
        value: INFO
